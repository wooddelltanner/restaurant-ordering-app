<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&family=Smythe&display=swap" rel="stylesheet">
    </head>
    <body>
        
        <header id="hero">
            <h1 id="title" class="background-shadow white-text">Jimmy's Diner</h1>
            <h2 class="background-shadow white-text">The best burgers and pizzas in town.</h2>
        </header>
        
        <section id="menu-container">
        </section>
        
        <section id="checkout" class="hidden">
            <h2 class="space-below">Your Order</h2>
            <div id="added-item">
            </div>
            <div class="flex-container-between space-above">
                <h2>Total Price:</h2>
                <h4 id="total-price"></h4>
            </div>
            <button class="btn" id="complete-order">Complete Order</button>
        </section>
        
        <section id="enter-card-details" class="hidden">
            <p class="inter close" id="close-card-details">X</p>
            <h4 class="inter space-below center-text">Enter Card Details</h4>
            <form id="card-form">
            </form>
        </section>
        
        <section id="thank-you-section" class="hidden">
        </section>
        
	<script src="index.js" type="module"></script>
    </body>
</html>
